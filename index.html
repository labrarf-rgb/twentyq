<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Twenty Q is a twenty questions game. Think of something and the handheld tries to read your mind." />
    <title>Twenty Q</title>
    <!-- Vite rewrites these root-absolute paths with the build's base ("/twentyq/" in production). -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="Twenty Q" />
    <meta name="theme-color" content="#e9e0cd" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        if (localStorage.getItem("twentyq.theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
